<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <!--
    Spray mist: 6 dots fanning out from bottom-left in an arc,
    sizes decrease toward the tip to suggest dispersion.
  -->
  <circle cx="6"  cy="26" r="2.2" fill="#70B9F5" fill-opacity="0.70"/>
  <circle cx="10" cy="21" r="2.0" fill="#70B9F5" fill-opacity="0.62"/>
  <circle cx="15" cy="17" r="1.7" fill="#70B9F5" fill-opacity="0.54"/>
  <circle cx="20" cy="14" r="1.4" fill="#70B9F5" fill-opacity="0.46"/>
  <circle cx="25" cy="11" r="1.1" fill="#70B9F5" fill-opacity="0.38"/>
  <circle cx="29" cy="9"  r="0.8" fill="#70B9F5" fill-opacity="0.28"/>
  <!-- tiny secondary scatter dots -->
  <circle cx="13" cy="14" r="0.9" fill="#70B9F5" fill-opacity="0.35"/>
  <circle cx="22" cy="17" r="0.7" fill="#70B9F5" fill-opacity="0.30"/>
  <circle cx="18" cy="11" r="0.7" fill="#70B9F5" fill-opacity="0.28"/>
</svg>
