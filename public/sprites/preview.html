<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Sprite Preview — Dream Clean Shine</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      background: #263445;
      font-family: sans-serif;
      color: white;
    }
    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 40px;
      align-items: flex-end;
    }
    .item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .item img {
      display: block;
    }
    .label {
      font-size: 12px;
      opacity: 0.7;
      text-align: center;
    }
    h1 { font-size: 18px; margin-bottom: 32px; font-weight: 400; letter-spacing: 0.05em; }
  </style>
</head>
<body>
  <h1>Dream Clean Shine — Sprite Sheet Preview</h1>
  <div class="grid">
    <div class="item">
      <img src="bubble.svg" width="128" height="128" alt="bubble"/>
      <span class="label">bubble</span>
    </div>
    <div class="item">
      <img src="suds.svg" width="128" height="128" alt="suds"/>
      <span class="label">suds</span>
    </div>
    <div class="item">
      <img src="cloud.svg" width="128" height="128" alt="cloud"/>
      <span class="label">cloud</span>
    </div>
    <div class="item">
      <img src="sun.svg" width="128" height="128" alt="sun"/>
      <span class="label">sun</span>
    </div>
    <div class="item">
      <img src="sparkle.svg" width="128" height="128" alt="sparkle"/>
      <span class="label">sparkle</span>
    </div>
    <div class="item">
      <img src="spray.svg" width="128" height="128" alt="spray"/>
      <span class="label">spray</span>
    </div>
    <div class="item">
      <img src="foam.svg" width="128" height="128" alt="foam"/>
      <span class="label">foam</span>
    </div>
  </div>
</body>
</html>
