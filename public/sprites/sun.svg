<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFDC50" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#FFDC50" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FFDC50" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#FFDC50" stop-opacity="0.40"/>
    </radialGradient>
  </defs>
  <!-- soft glow ring -->
  <circle cx="16" cy="16" r="15" fill="url(#glow)"/>
  <!-- 8 rounded rays -->
  <g stroke="#FFDC50" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.55">
    <line x1="16" y1="2"  x2="16" y2="6"/>
    <line x1="16" y1="26" x2="16" y2="30"/>
    <line x1="2"  y1="16" x2="6"  y2="16"/>
    <line x1="26" y1="16" x2="30" y2="16"/>
    <line x1="5.5"  y1="5.5"  x2="8.3"  y2="8.3"/>
    <line x1="23.7" y1="23.7" x2="26.5" y2="26.5"/>
    <line x1="26.5" y1="5.5"  x2="23.7" y2="8.3"/>
    <line x1="5.5"  y1="26.5" x2="8.3"  y2="23.7"/>
  </g>
  <!-- sun disc -->
  <circle cx="16" cy="16" r="7" fill="url(#sun)"/>
  <!-- shine -->
  <circle cx="12.5" cy="12.5" r="1.6" fill="white" fill-opacity="0.70"/>
  <circle cx="15"   cy="11"   r="0.8" fill="white" fill-opacity="0.50"/>
</svg>
