<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#263445" flood-opacity="0.15"/>
    </filter>
    <radialGradient id="cg" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.35"/>
    </radialGradient>
  </defs>
  <g filter="url(#shadow)">
    <!-- cloud bumps -->
    <circle cx="10" cy="20" r="6"  fill="url(#cg)"/>
    <circle cx="17" cy="17" r="8"  fill="url(#cg)"/>
    <circle cx="24" cy="20" r="5.5" fill="url(#cg)"/>
    <!-- flat base -->
    <rect x="4" y="20" width="24" height="6" rx="3" fill="url(#cg)"/>
  </g>
  <!-- shine -->
  <circle cx="13" cy="13" r="1.8" fill="white" fill-opacity="0.80"/>
  <circle cx="16" cy="11.5" r="0.9" fill="white" fill-opacity="0.60"/>
</svg>
